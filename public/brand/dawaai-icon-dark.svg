<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <defs>
    <!-- Cross vertical gradient dark -->
    <linearGradient id="crossDarkVertGrad" x1="100" y1="15" x2="100" y2="185" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="45%" stop-color="#162C46" />
      <stop offset="100%" stop-color="#0E1B2E" />
    </linearGradient>

    <!-- Cross horizontal gradient dark -->
    <linearGradient id="crossDarkHorizGrad" x1="15" y1="100" x2="185" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#155EEF" />
      <stop offset="50%" stop-color="#2E90FA" />
      <stop offset="100%" stop-color="#4B8BFF" />
    </linearGradient>

    <!-- Right lobe accent glow -->
    <linearGradient id="rightDarkLobeGrad" x1="110" y1="100" x2="185" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E90FA" />
      <stop offset="100%" stop-color="#84CAFF" />
    </linearGradient>

    <!-- Pill top-right half gradient -->
    <linearGradient id="pillDarkBlueGrad" x1="90" y1="70" x2="140" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#155EEF" />
      <stop offset="60%" stop-color="#4B8BFF" />
      <stop offset="100%" stop-color="#84CAFF" />
    </linearGradient>

    <!-- Pill bottom-left half gradient -->
    <linearGradient id="pillDarkWhiteGrad" x1="60" y1="130" x2="110" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F7FAFD" />
      <stop offset="100%" stop-color="#EAF2FF" />
    </linearGradient>

    <filter id="pillDarkShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Medical Cross Geometry -->
  <!-- Horizontal arm -->
  <rect x="18" y="70" width="164" height="60" rx="30" fill="url(#crossDarkHorizGrad)" />
  <!-- Right lobe accent glow -->
  <path d="M 120,70 h 32 a 30,30 0 0 1 30,30 v 0 a 30,30 0 0 1 -30,30 h -32 Z" fill="url(#rightDarkLobeGrad)" />

  <!-- Vertical arm -->
  <rect x="70" y="18" width="60" height="164" rx="30" fill="url(#crossDarkVertGrad)" />

  <!-- Center blend intersection -->
  <rect x="70" y="70" width="60" height="60" fill="#0E1B2E" opacity="0.40" />

  <!-- Angled Pill/Capsule Element (tilted at -42 deg around center 100,100) -->
  <g transform="rotate(-42 100 100)" filter="url(#pillDarkShadow)">
    <!-- Pill Outer Shell -->
    <rect x="52" y="77" width="96" height="46" rx="23" fill="#FFFFFF" />
    
    <!-- Left Half (Crisp White) -->
    <path d="M 75,79 h 25 v 42 h -25 a 21,21 0 0 1 -21,-21 v 0 a 21,21 0 0 1 21,-21 Z" fill="url(#pillDarkWhiteGrad)" />
    
    <!-- Right Half (Luminous Blue) -->
    <path d="M 100,79 h 25 a 21,21 0 0 1 21,21 v 0 a 21,21 0 0 1 -21,21 h -25 Z" fill="url(#pillDarkBlueGrad)" />
    
    <!-- Center Dividing Line -->
    <line x1="100" y1="78" x2="100" y2="122" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
</svg>
