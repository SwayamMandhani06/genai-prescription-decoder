<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" width="380" height="96" fill="none">
  <defs>
    <!-- Cross vertical gradient -->
    <linearGradient id="logoCrossVert" x1="42" y1="12" x2="42" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#674570" />
      <stop offset="45%" stop-color="#4A2E4D" />
      <stop offset="100%" stop-color="#361C39" />
    </linearGradient>

    <!-- Cross horizontal gradient -->
    <linearGradient id="logoCrossHoriz" x1="10" y1="48" x2="74" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5A8B" />
      <stop offset="50%" stop-color="#A56E9B" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>

    <!-- Pill top-right half gradient -->
    <linearGradient id="logoPillPink" x1="38" y1="36" x2="60" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="60%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#FDA4AF" />
    </linearGradient>

    <!-- Pill bottom-left half gradient -->
    <linearGradient id="logoPillWhite" x1="24" y1="60" x2="46" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFF0F3" />
      <stop offset="100%" stop-color="#FFD6DA" />
    </linearGradient>

    <filter id="logoPillShadow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#2E1E33" flood-opacity="0.22" />
    </filter>

    <style>
      .wordmark-serif {
        font-family: 'DM Serif Display', 'Playfair Display', 'Georgia', serif;
        font-weight: 700;
        font-size: 46px;
        fill: #4A2E4D;
      }
      .wordmark-sans {
        font-family: 'Inter', 'DM Sans', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #F472B6;
      }
      .tagline {
        font-family: 'Inter', 'DM Sans', system-ui, -apple-system, sans-serif;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 2.8px;
        fill: #7C5A8B;
      }
    </style>
  </defs>

  <!-- Left Emblem (Centered at x=45, y=48) -->
  <g transform="translate(4, 2)">
    <!-- Horizontal arm -->
    <rect x="10" y="34" width="70" height="26" rx="13" fill="url(#logoCrossHoriz)" />
    <!-- Vertical arm -->
    <rect x="32" y="12" width="26" height="70" rx="13" fill="url(#logoCrossVert)" />
    <!-- Center blend -->
    <rect x="32" y="34" width="26" height="26" fill="#5A375E" opacity="0.3" />

    <!-- Overlaid angled capsule -->
    <g transform="rotate(-42 45 47)" filter="url(#logoPillShadow)">
      <rect x="23" y="37" width="44" height="20" rx="10" fill="#FFFFFF" />
      <!-- Left Half -->
      <path d="M 33,38 h 11 v 18 h -11 a 9,9 0 0 1 -9,-9 v 0 a 9,9 0 0 1 9,-9 Z" fill="url(#logoPillWhite)" />
      <!-- Right Half -->
      <path d="M 46,38 h 11 a 9,9 0 0 1 9,9 v 0 a 9,9 0 0 1 -9,9 h -11 Z" fill="url(#logoPillPink)" />
      <!-- Separation Line -->
      <line x1="45" y1="38" x2="45" y2="56" stroke="#FFFFFF" stroke-width="1.2" />
    </g>
  </g>

  <!-- Right Typography: Wordmark + Tagline -->
  <g transform="translate(104, 0)">
    <text x="0" y="54">
      <tspan class="wordmark-serif">Dawa</tspan><tspan class="wordmark-sans">AI</tspan>
    </text>
    <text x="3" y="73" class="tagline">YOUR PRESCRIPTION, MADE CLEAR.</text>
  </g>
</svg>
