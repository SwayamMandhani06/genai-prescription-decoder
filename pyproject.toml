[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-prescription-decoder"
version = "1.0.0"
description = "Explainable Multimodal AI for Handwritten Prescription Understanding (DawaAI)"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = [".", "backend"]
include = ["ai*", "app*", "eval*"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
markers = [
    "unit: fast, deterministic tests using dependency-injected fixtures",
    "live_inference: end-to-end tests requiring live VLM/OCR execution on data/samples/",
    "integration: end-to-end component integration tests",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore:.*StarletteDeprecationWarning.*",
    "ignore::DeprecationWarning",
]
