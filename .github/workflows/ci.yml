name: DawaAI CI & Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-quality:
    name: Frontend Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and Lint
        run: npm run lint

      - name: Run Frontend Contract & State Tests
        run: npm run test

      - name: Verify Production Build
        run: npm run build

  backend-quality:
    name: Backend Test Suite & Safety Gates
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-eng

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run Fast Deterministic Unit Tests (Coverage Enforced >= 80%)
        env:
          PYTHONPATH: .
          USE_MOCK_PIPELINE: "true"
        run: |
          python -m pytest backend/tests/ -m "not live_inference" --cov=backend/app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 -q

      - name: Run Live Inference Golden Regression Tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests/ -m "live_inference" -q
