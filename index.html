<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DawaAI — Your Prescription, Made Clear.</title>
    <meta name="description" content="DawaAI: Explainable Multimodal AI for Handwritten Prescription Understanding. Assistive prescription interpretation, evidence-grounded medicine validation, uncertainty awareness, and multilingual patient explanations." />
    <meta name="theme-color" content="#F8F2F6" />

    <!-- Open Graph Metadata -->
    <meta property="og:title" content="DawaAI — Your Prescription, Made Clear." />
    <meta property="og:description" content="Explainable Multimodal AI for Handwritten Prescription Understanding. Assistive AI prototype for prescription clarity, safety screening, and multilingual posology." />
    <meta property="og:image" content="/brand/dawaai-logo.svg" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts: DM Serif Display, Inter & DM Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Theme Initialization: Default to LIGHT on first visit unless dark explicitly saved -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dawaai-theme-preference') || localStorage.getItem('aura-theme-preference');
          if (saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-theme-primary font-sans antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
