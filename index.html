    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AURA-Rx | Explainable Multimodal AI for Handwritten Prescription Understanding</title>
    <meta name="description" content="Academic Capstone Research: Explainable Multimodal AI for handwritten medical prescription interpretation, clinical evidence grounding, calibrated uncertainty quantification, and multilingual patient explanations." />
    <meta name="theme-color" content="#F3EFE6" />

    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <!-- Theme Initialization: Default to LIGHT on first visit unless dark explicitly saved -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('aura-theme-preference');
          if (saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-canvas text-theme-primary font-sans antialiased min-h-screen overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
